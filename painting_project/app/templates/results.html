<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: rgb(56, 56, 56);
            margin: 40px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h1 {
            text-align: center;
            font-size: 80px;
            font-weight: 600;
            color: white;
            margin-bottom: 40px;
            font-family: 'Dancing Script', cursive;
        }
        .card {
            padding: 20px;
            border-radius: 50px;
            background-color: grey;
            width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 20px 20px 20px 20px rgba(0, 0, 0, 0.3);
        }
        #table {
            width: 95%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            border-radius: 20px;
        }
        th, td {
            padding: 15px;
            text-align: left;
            background-color: black;
            color: white;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #502584;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>{{ title }}</h1>
    <table id="table">
        <thead>
            <tr>
                {% for header in headers %}
                    <th>{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in results %}
                <tr>
                    {% for value in row %}
                        <td>{{ value }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
